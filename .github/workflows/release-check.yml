name: release-check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify CLI
        run: |
          uggo-lint --help
          # Verify the check-file path works without requiring the Go toolchain,
          # since this job only validates that the Python package installs and runs.
          printf 'package main\n\nfunc main() {}\n' > /tmp/verify.go
          uggo-lint check-file /tmp/verify.go --format json
