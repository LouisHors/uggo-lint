runner: golangci-lint
mode: default
only_staged: true
check_only: false
hook_backend: auto
ignore_paths:
  - vendor/
ignore_rules:
  - no-fire-and-forget-go
required_tools:
  - go
  - golangci-lint
  - goimports
default_linters:
  - govet
  - errcheck
  - staticcheck
custom_rules:
  no-init: error
  no-panic-outside-tests: error
  no-fire-and-forget-go: warning
